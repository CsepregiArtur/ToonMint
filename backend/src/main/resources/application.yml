server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,image/png,image/jpeg,image/webp

spring:
  application:
    name: toonmint
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # Redis nu este necesar în dezvoltare (rate limiting și cache rulează în memorie).
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}
    # Verificarea SMTP se activează doar când trimiterea de email este pornită.
    mail:
      enabled: ${MAIL_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789}
    ttl: PT24H
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jobs:
    threads: 4
    credits-per-job: 1
    max-input-bytes: 10485760
    max-output-dimension: 1024
    styles:
      anime_v1:
        label: Anime
        prompt: >-
          Transform this photograph into a polished anime illustration. Keep the
          subject, pose and facial expression recognizable, use clean line art,
          vibrant cel shading and soft highlights. No text, no watermark.
      cartoon_v2:
        label: Cartoon
        prompt: >-
          Redraw this photograph as a friendly modern cartoon. Keep the subject
          and composition, simplify details, use bold outlines and warm, cheerful
          colors. No text, no watermark.
      pixel_v3:
        label: Pixel art
        prompt: >-
          Convert this photograph into detailed 16-bit pixel art. Preserve the
          subject and silhouette, use a limited retro palette and crisp pixel
          edges. No text, no watermark.
      comic_v4:
        label: Comic book
        prompt: >-
          Recreate this photograph as a comic book panel. Preserve the subject and
          framing, use dynamic ink lines, halftone shading and saturated colors.
          No text, no watermark.
  rate-limit:
    enabled: true
    backend: ${RATE_LIMIT_BACKEND:memory}
    requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:10}
  temp-store:
    backend: ${TEMP_STORE_BACKEND:memory}
    ttl: PT10M
    max-entries: 2000
  ai:
    provider: ${AI_PROVIDER:stub}
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_IMAGE_MODEL:gemini-3.1-flash-image}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    max-attempts: 5
    initial-backoff: PT0.2S
    max-backoff: PT5S
    timeout: PT60S
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_USERNAME:no-reply@toonmint.local}
    from-name: ${MAIL_FROM_NAME:ToonMint}
  revenuecat:
    webhook-auth-token: ${REVENUECAT_WEBHOOK_AUTH_TOKEN:}
    purchase-link-base-url: ${REVENUECAT_PURCHASE_LINK_URL:}
    entitlement-id: ${REVENUECAT_ENTITLEMENT_ID:pro}
    products:
      - id: toonmint_weekly_499
        kind: SUBSCRIPTION
        subscription-type: WEEKLY
        credits: 50
        label: Weekly plan (50 generations)
        price: $4.99 / week
      - id: toonmint_yearly_2499
        kind: SUBSCRIPTION
        subscription-type: YEARLY
        credits: 300
        label: Yearly plan (300 generations)
        price: $24.99 / year
      - id: toonmint_credits_20
        kind: CREDIT_PACK
        credits: 20
        label: 20 extra generations
        price: $1.99
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
