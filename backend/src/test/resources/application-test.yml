spring:
  datasource:
    url: jdbc:h2:mem:toonmint-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  mail:
    host: localhost
    port: 2525

app:
  jwt:
    secret: test-secret-test-secret-test-secret-0123456789
    ttl: PT1H
  jobs:
    threads: 1
    max-output-dimension: 512
  rate-limit:
    enabled: true
    backend: memory
    requests-per-minute: 1000
  temp-store:
    backend: memory
    ttl: PT10M
    max-entries: 100
  ai:
    provider: stub
  mail:
    enabled: false
    from: no-reply@toonmint.test
  revenuecat:
    webhook-auth-token: test-webhook-token
    purchase-link-base-url: https://pay.rev.cat/test-link
  admin:
    email: ""
    password: ""

logging:
  level:
    org.hibernate.SQL: WARN
    com.toonmint: INFO
