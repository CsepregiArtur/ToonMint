spring:
  datasource:
    url: jdbc:h2:mem:toonmint-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  mail:
    host: localhost
    port: 2525

app:
  jwt:
    secret: test-secret-test-secret-test-secret-0123456789
    ttl: PT1H
  jobs:
    threads: 1
    max-output-dimension: 512
    # Testele nu trebuie să atingă fișierele reale din frontend/public/demo.
    style-preview-output-dir: ${java.io.tmpdir}/toonmint-test-style-previews
    style-preview-source: ${java.io.tmpdir}/toonmint-test-before.png
    style-preview-delay-millis: 0
  rate-limit:
    enabled: true
    backend: memory
    requests-per-minute: 1000
  temp-store:
    backend: memory
    ttl: PT10M
    max-entries: 100
  ai:
    provider: stub
  finance:
    reporting-currency: USD
    cost-per-generation: 0.034
  mail:
    enabled: false
    from: no-reply@toonmint.test
  revenuecat:
    webhook-auth-token: test-webhook-token
    purchase-link-base-url: https://pay.rev.cat/test-link
  admin:
    email: ""
    password: ""
  demo:
    enabled: true
    user-email: demo@toonmint.test
    user-password: demo12345
    user-credits: 10
    admin-email: operator@toonmint.test
    admin-password: operator12345
    admin-credits: 10

logging:
  level:
    org.hibernate.SQL: WARN
    com.toonmint: INFO
