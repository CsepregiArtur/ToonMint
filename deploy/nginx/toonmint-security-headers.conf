# ToonMint — header-e de securitate pentru răspunsurile HTML/static.
# Se include în fiecare `location` care servește SPA-ul, pentru că `add_header`
# se moștenește doar dacă locația nu definește propriile `add_header`.
# `always` este obligatoriu: altfel nginx nu trimite headerul pe răspunsurile 4xx/5xx.

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy 'camera=(), microphone=(), geolocation=(), payment=(self "https://pay.rev.cat")' always;
add_header Strict-Transport-Security "max-age=15552000" always;
