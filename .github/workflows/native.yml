name: native

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/native.yml'
  pull_request:
    paths:
      - 'backend/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: GraalVM JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      # Jar obisnuit (fara AOT), folosit doar ca sa rulam aplicatia sub tracing agent.
      - name: Build JVM jar
        working-directory: backend
        run: mvn -B -DskipTests package

      # libawt rezolva la JNI_OnLoad o lista de clase si metode care nu sunt
      # vizibile static (FindClass/GetStaticMethodID/GetMethodID). Agentul le
      # descopera ruland exact fluxul pe care il testam, in loc sa le adunam manual.
      - name: Collect native-image metadata
        working-directory: backend
        run: |
          set -uo pipefail
          set +e

          rm -rf data target/native-agent
          mkdir -p target/native-agent
          java -agentlib:native-image-agent=config-output-dir=target/native-agent \
            -jar target/toonmint-backend-1.0.0.jar > agent.log 2>&1 &
          PID=$!

          ./scripts/native-smoke.sh
          RC=$?

          kill $PID 2>/dev/null
          wait $PID 2>/dev/null

          if [ $RC -ne 0 ]; then
            echo "::error::JVM smoke flow failed while collecting metadata"
            echo "::group::agent.log"
            tail -80 agent.log
            echo "::endgroup::"
            exit 1
          fi

          # Continutul directorului e generat la fiecare rulare; nu se comite.
          mkdir -p src/main/resources/META-INF/native-image/com.toonmint/agent
          for f in target/native-agent/*.json; do
            [ -e "$f" ] || continue
            cp "$f" src/main/resources/META-INF/native-image/com.toonmint/agent/
            echo "collected $(basename "$f") ($(wc -c < "$f") bytes)"
          done

      - name: Compile native image
        working-directory: backend
        run: mvn -B -Pnative native:compile -DskipTests

      - name: Smoke test
        working-directory: backend
        run: |
          set -uo pipefail
          set +e

          rm -rf data
          START=$(date +%s%3N)
          ./target/toonmint-backend > native.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT

          ./scripts/native-smoke.sh
          RC=$?

          if [ $RC -ne 0 ]; then
            echo "::error::native binary failed the smoke flow"
            echo "::group::native.log"
            tail -200 native.log
            echo "::endgroup::"
            exit 1
          fi

          echo "startup + flow: $(( $(date +%s%3N) - START )) ms"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: toonmint-native
          path: backend/target/toonmint-backend
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-logs
          path: |
            backend/native.log
            backend/agent.log
            backend/src/main/resources/META-INF/native-image/com.toonmint/agent/*.json
          if-no-files-found: ignore
