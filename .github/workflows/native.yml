name: native

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/native.yml'
  pull_request:
    paths:
      - 'backend/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: GraalVM JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Compile native image
        working-directory: backend
        run: mvn -B -Pnative native:compile -DskipTests

      # Startup + ImageIO/Thumbnailator round-trip inside the native binary.
      # The dev profile uses a local H2 database and StubImageProvider, so no external service is needed.
      - name: Smoke test
        working-directory: backend
        run: |
          set -uo pipefail
          START=$(date +%s%3N)
          ./target/toonmint-backend > native.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT

          dump() {
            echo "::group::native.log"
            tail -200 native.log
            echo "::endgroup::"
          }

          UP=0
          for _ in $(seq 1 300); do
            if ! kill -0 $PID 2>/dev/null; then
              echo "::error::Native binary exited before becoming healthy"
              wait $PID; echo "exit code: $?"
              dump
              exit 1
            fi
            if curl -fsS http://localhost:8080/actuator/health > /dev/null 2>&1; then
              UP=1
              break
            fi
            sleep 0.2
          done

          if [ $UP -ne 1 ]; then
            echo "::error::Application did not become healthy within 60s"
            dump
            exit 1
          fi

          curl -fsS http://localhost:8080/actuator/health
          echo "startup: $(( $(date +%s%3N) - START )) ms"

          # /actuator/health răspunde înainte ca ApplicationRunner-ele să termine,
          # iar conturile demo sunt create de DemoDataSeeder, deci se reîncearcă.
          TOKEN=""
          for _ in $(seq 1 30); do
            TOKEN=$(curl -fsS -X POST http://localhost:8080/api/auth/demo-login \
              -H 'Content-Type: application/json' -d '{}' 2>/dev/null | jq -r '.token // empty')
            [ -n "$TOKEN" ] && break
            sleep 1
          done
          if [ -z "$TOKEN" ]; then
            echo "::error::demo-login never returned a token"
            dump
            exit 1
          fi

          STYLE_ID=$(curl -fsS http://localhost:8080/api/styles | jq -r '.[0].id')
          if [ -z "$STYLE_ID" ] || [ "$STYLE_ID" = "null" ]; then
            echo "::error::style catalog is empty"
            dump
            exit 1
          fi

          convert -size 640x480 gradient:orange-blue /tmp/in.png
          JOB_ID=$(curl -fsS -X POST http://localhost:8080/api/jobs \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d "{\"styleId\":\"$STYLE_ID\",\"imageBase64\":\"$(base64 -w0 /tmp/in.png)\"}" | jq -r '.id // empty')
          if [ -z "$JOB_ID" ]; then
            echo "::error::job creation failed"
            dump
            exit 1
          fi

          STATUS=PENDING
          for _ in $(seq 1 60); do
            STATUS=$(curl -fsS -H "Authorization: Bearer $TOKEN" \
              http://localhost:8080/api/jobs/$JOB_ID | jq -r .status)
            [ "$STATUS" = "COMPLETED" ] && break
            [ "$STATUS" = "FAILED" ] && { echo "::error::Job failed"; dump; exit 1; }
            sleep 1
          done
          if [ "$STATUS" != "COMPLETED" ]; then
            echo "::error::Job ended in state $STATUS"
            dump
            exit 1
          fi

          curl -fsS -o /tmp/out.png -H "Authorization: Bearer $TOKEN" \
            http://localhost:8080/api/jobs/$JOB_ID/download
          file /tmp/out.png

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: toonmint-native
          path: backend/target/toonmint-backend
          if-no-files-found: error

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-smoke-log
          path: backend/native.log
          if-no-files-found: ignore
